name: Generate Pacman Graph
on:
  schedule:
    - cron: '0 0 * * 0'  # كل أسبوع (الأحد منتصف الليل)
  workflow_dispatch:      # يمكن تشغيله يدويًا

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install canvas svg.js

      - name: Generate Pac-Man Contributions SVG
        id: generate
        run: |
          mkdir -p assets
          node << 'EOF'
          const { createCanvas, loadImage } = require('canvas');
          const fs = require('fs').promises;

          // إعدادات الصورة
          const width = 1000;
          const height = 200;
          const canvas = createCanvas(width, height);
          const ctx = canvas.getContext('2d');

          // خلفية داكنة
          ctx.fillStyle = '#0d1117';
          ctx.fillRect(0, 0, width, height);

          // رسم شبكة المساهمات (12 شهر × ~30 يوم = 360 خانة)
          const months = ['Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov'];
          const cellSize = 20;
          const startX = 40;
          const startY = 40;

          // رسم التسميات العلوية (الأشهر)
          ctx.font = '12px sans-serif';
          ctx.fillStyle = '#8b949e';
          months.forEach((m, i) => {
            ctx.fillText(m, startX + i * cellSize * 30 + 10, startY - 10);
          });

          // رسم الخلايا (مثل GitHub contributions grid)
          for (let m = 0; m < 12; m++) {
            for (let d = 0; d < 30; d++) {
              const x = startX + m * cellSize * 30 + d * cellSize;
              const y = startY + 10;
              ctx.strokeStyle = '#30363d';
              ctx.lineWidth = 1;
              ctx.strokeRect(x, y, cellSize, cellSize);

              // مثال: ضع بعض "المساهمات" (أخضر فاتح)
              if ((m + d) % 7 === 0) {
                ctx.fillStyle = '#1f883d';
                ctx.fillRect(x + 1, y + 1, cellSize - 2, cellSize - 2);
              }
            }
          }

          // رسم مسار باك-مان (خط أبيض متعرج)
          ctx.strokeStyle = 'white';
          ctx.lineWidth = 2;
          ctx.beginPath();
          let px = startX, py = startY + 50;
          ctx.moveTo(px, py);
          for (let i = 0; i < 10; i++) {
            px += (i % 2 === 0) ? 60 : 40;
            py += (i % 3 === 0) ? 20 : -15;
            ctx.lineTo(px, py);
          }
          ctx.stroke();

          // رسم باك-مان ( circle with mouth )
          const drawPacman = (x, y, color = '#FFD700') => {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, 8, 0.2 * Math.PI, 1.8 * Math.PI);
            ctx.lineTo(x, y);
            ctx.fill();
          };

          // رسم أشباح
          const drawGhost = (x, y, color) => {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, 8, 0, Math.PI * 2);
            ctx.moveTo(x - 6, y + 6);
            ctx.lineTo(x - 2, y + 10);
            ctx.lineTo(x + 2, y + 10);
            ctx.lineTo(x + 6, y + 6);
            ctx.closePath();
            ctx.fill();
            // عين
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(x - 3, y - 2, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(x - 3, y - 2, 1, 0, Math.PI * 2);
            ctx.fill();
          };

          // وضع الشخصيات في أماكن محددة (يمكن تعديلها حسب رغبتك)
          drawPacman(800, 80);           // باك-مان في右边
          drawGhost(720, 60, '#FF0000'); // أشباح
          drawGhost(760, 90, '#FFA500');
          drawGhost(840, 70, '#00FFFF');

          // حفظ الصورة
          const buffer = canvas.toBuffer('image/svg');
          await fs.writeFile('assets/pacman-contributions.svg',
            `<?xml version="1.0" encoding="UTF-8"?>
            <svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">
              <rect width="100%" height="100%" fill="#0d1117"/>
              ${canvas.toSVG ? canvas.toSVG() : ''}
            </svg>`);
          EOF

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🎨 Auto-generated Pac-Man contributions art"
          file_pattern: 'assets/pacman-contributions.svg'
